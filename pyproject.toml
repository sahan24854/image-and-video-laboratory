[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "educodec"
version = "0.1.0"
description = "Educational transform image and hybrid video compression"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9"]

[project.scripts]
educodec = "educodec.cli:main"

[tool.setuptools.packages.find]
include = ["educodec*"]

[project.optional-dependencies]
ui = ["streamlit>=1.49", "pandas>=2", "av>=14"]
